version: "3.8"
services:
  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=/app/configs/config.dev.yaml
    volumes:
      - ./configs:/app/configs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped