apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: go-video
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 25Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: go-video
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: RUSTFS_ACCESS_KEY
              value: "jiangqiao"
            - name: RUSTFS_SECRET_KEY
              value: "jiangqiao"
            - name: RUSTFS_VOLUMES
              value: "/data/rustfs0"
            - name: RUSTFS_ADDRESS
              value: "0.0.0.0:9000"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: "0.0.0.0:9001"
            - name: RUSTFS_CORS_ALLOWED_ORIGINS
              value: "*"
            - name: RUSTFS_CORS_ALLOWED_METHODS
              value: "GET,PUT,HEAD,DELETE,OPTIONS"
            - name: RUSTFS_CORS_ALLOWED_HEADERS
              value: "content-type,x-amz-content-sha256,x-amz-date"
            - name: RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS
              value: "*"
            - name: RUSTFS_CONSOLE_CORS_ALLOWED_METHODS
              value: "GET,PUT,HEAD,DELETE,OPTIONS"
            - name: RUSTFS_CONSOLE_CORS_ALLOWED_HEADERS
              value: "content-type,x-amz-content-sha256,x-amz-date"
          volumeMounts:
            - name: rustfs-data
              mountPath: /data/rustfs0
            - name: rustfs-logs
              mountPath: /logs
      volumes:
        - name: rustfs-data
          persistentVolumeClaim:
            claimName: rustfs-data
        - name: rustfs-logs
          hostPath:
            path: /var/log/rustfs
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: go-video
spec:
  type: NodePort
  selector:
    app: rustfs
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      nodePort: 30900
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30091
