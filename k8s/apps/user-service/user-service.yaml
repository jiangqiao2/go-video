## 用户服务 Deployment 和 Service
# 提供用户注册、登录、资料、关系等 HTTP/gRPC 能力，部署在 go-video 命名空间
apiVersion: apps/v1 # Deployment API 版本
kind: Deployment # 部署用户服务
metadata:
  name: user-service # Deployment 名称
  namespace: go-video # 命名空间
spec:
  replicas: 2 # 副本数
  selector:
    matchLabels:
      app: user-service # 匹配标签
  template:
    metadata:
      labels:
        app: user-service # Pod 标签
    spec:
      imagePullSecrets:
        - name: acr-cred # 私有镜像凭证
      containers:
        - name: user-service # 容器名称
          image: crpi-cf5tmc2njsrq2eko.cn-hangzhou.personal.cr.aliyuncs.com/jiangqiao1/user-service:latest # 镜像（流水线会通过 set image 替换为带 tag 的镜像）
          imagePullPolicy: IfNotPresent # 拉取策略
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/certs
              readOnly: true
          # Secret user-service-jwt 需预先创建，内含 private.pem/public.pem
          env:
            - name: CONFIG_PATH # 配置文件路径
              value: "/app/configs/config_prod.yaml"
            - name: TZ # 时区
              value: "Asia/Shanghai"
            - name: PROFILE_ENABLED # 是否开启持续 Profiling（1/true 开启）
              value: "1"
            - name: PROFILE_SERVER # Pyroscope 服务地址（ClusterIP）
              value: "http://pyroscope.observability.svc.cluster.local:4040"
            - name: PROFILE_ENV # Profile 中标记的环境（dev/prod 等）
              value: "prod"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT # OTLP 导出目标（Collector）
              value: "http://otel-collector.observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_INSECURE # 是否关闭 TLS 校验
              value: "true"
            - name: OTEL_TRACES_SAMPLING_RATE # 链路采样率
              value: "0.1"
          ports:
            - containerPort: 8081 # HTTP 端口
            - containerPort: 9091 # gRPC 端口
          resources:
            requests:
              cpu: "200m" # 最低 CPU 申请
              memory: "256Mi" # 最低内存申请
            limits:
              cpu: "1" # CPU 上限
              memory: "1Gi" # 内存上限
          readinessProbe:
            tcpSocket:
              port: 8081 # 就绪探针端口
            initialDelaySeconds: 5 # 初始延迟
            periodSeconds: 10 # 周期
          livenessProbe:
            tcpSocket:
              port: 8081 # 存活探针端口
            initialDelaySeconds: 15 # 初始延迟
            periodSeconds: 20 # 周期
      volumes:
        - name: jwt-keys
          secret:
            secretName: user-service-jwt
            items:
              - key: private.pem
                path: private.pem
              - key: public.pem
                path: public.pem
---
apiVersion: v1 # Service API 版本
kind: Service # 暴露用户服务
metadata:
  name: user-service # Service 名称
  namespace: go-video # 命名空间
spec:
  selector:
    app: user-service # 选择标签
  ports:
    - name: http # HTTP 端口
      port: 8081 # ClusterIP 端口
      targetPort: 8081 # 转发到容器
    - name: grpc # gRPC 端口
      port: 9091 # ClusterIP 端口
      targetPort: 9091 # 转发到容器
