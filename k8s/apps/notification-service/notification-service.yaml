## 通知服务 Deployment 与 Service
# 提供站内通知列表、未读红点等 HTTP 能力，部署在 go-video 命名空间
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: go-video
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      imagePullSecrets:
        - name: acr-cred
      containers:
        - name: notification-service
          image: <REPLACE_NOTIFICATION_IMAGE> # 部署时替换镜像
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_PATH
              value: "/app/configs/config_prod.yaml"
            - name: TZ
              value: "Asia/Shanghai"
          ports:
            - containerPort: 8086 # HTTP 端口
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: go-video
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8086
      targetPort: 8086

