## RustFS 对象存储 Deployment + PVC + Service
# 使用 rustfs/rustfs 作为 MinIO 替代，提供 S3 兼容存储与控制台，并暴露 NodePort
apiVersion: v1 # API 版本
kind: PersistentVolumeClaim # RustFS 数据卷
metadata:
  name: rustfs-data # PVC 名称
  namespace: go-video # 命名空间
spec:
  accessModes:
    - ReadWriteOnce # 单节点读写
  resources:
    requests:
      storage: 25Gi # 存储大小
  storageClassName: local-path # 存储类
---
apiVersion: apps/v1 # Deployment API 版本
kind: Deployment # 部署 RustFS (MinIO 替代)
metadata:
  name: rustfs # Deployment 名称
  namespace: go-video # 命名空间
spec:
  replicas: 1 # 副本数
  selector:
    matchLabels:
      app: rustfs # 匹配标签
  template:
    metadata:
      labels:
        app: rustfs # Pod 标签
    spec:
      containers:
        - name: rustfs # 容器名称
          image: rustfs/rustfs:latest # 镜像
          imagePullPolicy: IfNotPresent # 拉取策略
          ports:
            - containerPort: 9000 # S3 兼容 API 端口
            - containerPort: 9001 # 控制台端口
          env:
            - name: RUSTFS_ACCESS_KEY # 访问账号
              value: "jiangqiao"
            - name: RUSTFS_SECRET_KEY # 访问密码
              value: "jiangqiao"
            - name: RUSTFS_VOLUMES # 数据目录
              value: "/data/rustfs0"
            - name: RUSTFS_ADDRESS # 服务监听地址
              value: "0.0.0.0:9000"
            - name: RUSTFS_CONSOLE_ENABLE # 是否开启控制台
              value: "true"
            - name: RUSTFS_CONSOLE_ADDRESS # 控制台监听地址
              value: "0.0.0.0:9001"
            - name: RUSTFS_CORS_ALLOWED_ORIGINS # API 允许的跨域源
              value: "*"
            - name: RUSTFS_CORS_ALLOWED_METHODS # API 允许的方法
              value: "GET,PUT,HEAD,DELETE,OPTIONS"
            - name: RUSTFS_CORS_ALLOWED_HEADERS # API 允许的头
              value: "content-type,x-amz-content-sha256,x-amz-date"
            - name: RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS # 控制台允许的跨域源
              value: "*"
            - name: RUSTFS_CONSOLE_CORS_ALLOWED_METHODS # 控制台允许的方法
              value: "GET,PUT,HEAD,DELETE,OPTIONS"
            - name: RUSTFS_CONSOLE_CORS_ALLOWED_HEADERS # 控制台允许的头
              value: "content-type,x-amz-content-sha256,x-amz-date"
          volumeMounts:
            - name: rustfs-data # 数据卷
              mountPath: /data/rustfs0 # 数据目录挂载
            - name: rustfs-logs # 日志卷
              mountPath: /logs # 日志路径
      volumes:
        - name: rustfs-data # 数据卷声明
          persistentVolumeClaim:
            claimName: rustfs-data # 绑定 PVC
        - name: rustfs-logs # 日志卷声明
          hostPath:
            path: /var/log/rustfs # 节点上的目录
            type: DirectoryOrCreate # 若不存在则创建
---
apiVersion: v1 # Service API 版本
kind: Service # 暴露 RustFS
metadata:
  name: rustfs # Service 名称
  namespace: go-video # 命名空间
spec:
  type: NodePort # 节点端口类型
  selector:
    app: rustfs # 选择标签
  ports:
    - name: http # API 端口
      port: 9000 # ClusterIP 端口
      targetPort: 9000 # 转发到容器
      nodePort: 30900 # 节点端口
    - name: console # 控制台端口
      port: 9001 # ClusterIP 端口
      targetPort: 9001 # 转发到容器
      nodePort: 30091 # 节点端口
