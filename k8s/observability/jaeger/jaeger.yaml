## Jaeger 链路追踪系统
# - Deployment: all-in-one 模式，集成 UI + Collector + Query
# - Service jaeger-query: 通过 NodePort 暴露 16686（UI/查询）
# - Service jaeger-collector: 在集群内暴露 gRPC Collector 端口 14250
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          args:
            - "--collector.otlp.enabled=true"
          ports:
            - name: http
              containerPort: 16686
            - name: grpc-collector
              containerPort: 14250
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
---
# Jaeger Query Service：NodePort 暴露 Web UI 与查询接口
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: observability
  labels:
    app: jaeger
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: http
      port: 16686
      targetPort: 16686
      nodePort: 31686
---
# Jaeger Collector Service：供 OTel Collector / SDK 上报 traces 使用
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: observability
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: grpc-collector
      port: 14250
      targetPort: 14250
