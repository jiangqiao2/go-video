## Grafana Loki 数据源 ConfigMap
# 通过 kps-kube-prometheus-stack 的 sidecar 自动加载 Loki 为一个日志数据源
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: observability
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kps
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.observability.svc:3100
        isDefault: false
        jsonData:
          maxLines: 1000
