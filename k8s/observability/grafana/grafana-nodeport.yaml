## Grafana NodePort Service
# 通过 NodePort 30030 暴露 kube-prometheus-stack 中的 Grafana Web 控制台
apiVersion: v1
kind: Service
metadata:
  name: kps-grafana-nodeport
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kps
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kps
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 30030
