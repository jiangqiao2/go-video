apiVersion: v1
kind: Service
metadata:
  name: kps-prometheus-nodeport
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    prometheus: kps-kube-prometheus-stack-prometheus
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    prometheus: kps-kube-prometheus-stack-prometheus
  ports:
    - name: http-web
      port: 9090
      targetPort: 9090
      nodePort: 30090
