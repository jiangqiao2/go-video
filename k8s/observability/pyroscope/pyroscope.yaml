apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyroscope
  namespace: observability
  labels:
    app: pyroscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pyroscope
  template:
    metadata:
      labels:
        app: pyroscope
    spec:
      containers:
        - name: pyroscope
          image: grafana/pyroscope:latest
          imagePullPolicy: IfNotPresent
          args:
            - "server"
          ports:
            - containerPort: 4040
              name: http
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: pyroscope
  namespace: observability
  labels:
    app: pyroscope
spec:
  type: NodePort
  selector:
    app: pyroscope
  ports:
    - name: http
      port: 4040
      targetPort: 4040
      protocol: TCP
      nodePort: 30440

