apiVersion: apps/v1 # Deployment API 版本
kind: Deployment # 部署转码服务
metadata:
  name: transcode-service # Deployment 名称
  namespace: go-video # 命名空间
spec:
  replicas: 1 # 副本数
  selector:
    matchLabels:
      app: transcode-service # 匹配标签
  strategy:
    type: RollingUpdate # 滚动更新
    rollingUpdate:
      maxSurge: 0 # 不超额创建
      maxUnavailable: 1 # 同时最多 1 个不可用
  template:
    metadata:
      labels:
        app: transcode-service # Pod 标签
    spec:
      runtimeClassName: nvidia # 使用 GPU runtime
      imagePullSecrets:
        - name: acr-cred # 私有镜像仓库凭证
      containers:
        - name: transcode-service # 容器名称
          image: <REPLACE_TRANSCODE_IMAGE> # 镜像（部署时替换）
          imagePullPolicy: IfNotPresent # 拉取策略
          env:
            - name: CONFIG_PATH # 配置文件路径
              value: "/app/configs/config_prod.yaml"
            - name: GO_VIDEO_DEPENDENCIES_UPLOAD_SERVICE_ADDRESS # 上传服务 gRPC 地址
              value: "upload-service:9093"
            - name: GO_VIDEO_DEPENDENCIES_VIDEO_SERVICE_ADDRESS # 视频服务 gRPC 地址
              value: "video-service:9094"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_SAMPLING_RATE
              value: "0.1"
          ports:
            - containerPort: 8083 # HTTP 端口
            - containerPort: 9092 # gRPC 端口
          resources:
            requests:
              cpu: "4" # 最低 CPU 申请
              memory: "8Gi" # 最低内存申请
              nvidia.com/gpu: 1 # 申请 1 块 GPU
            limits:
              cpu: "12" # CPU 限制
              memory: "32Gi" # 内存限制
              nvidia.com/gpu: 1 # GPU 限制
          readinessProbe:
            tcpSocket:
              port: 8083 # 就绪探针端口
            initialDelaySeconds: 10 # 初始延迟
            periodSeconds: 10 # 周期
          livenessProbe:
            tcpSocket:
              port: 8083 # 存活探针端口
            initialDelaySeconds: 30 # 初始延迟
            periodSeconds: 20 # 周期
---
apiVersion: v1 # Service API 版本
kind: Service # 暴露转码服务
metadata:
  name: transcode-service # Service 名称
  namespace: go-video # 命名空间
spec:
  selector:
    app: transcode-service # 选择标签
  ports:
    - name: http # HTTP 端口
      port: 8083 # ClusterIP 端口
      targetPort: 8083 # 转发到容器
    - name: grpc # gRPC 端口
      port: 9092 # ClusterIP 端口
      targetPort: 9092 # 转发到容器
