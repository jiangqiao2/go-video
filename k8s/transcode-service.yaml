apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcode-service
  namespace: go-video
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transcode-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: transcode-service
    spec:
      runtimeClassName: nvidia
      imagePullSecrets:
        - name: acr-cred
      containers:
        - name: transcode-service
          image: <REPLACE_TRANSCODE_IMAGE>
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_PATH
              value: "/app/configs/config_prod.yaml"
            - name: GO_VIDEO_DEPENDENCIES_UPLOAD_SERVICE_ADDRESS
              value: "upload-service:9093"
            - name: GO_VIDEO_DEPENDENCIES_VIDEO_SERVICE_ADDRESS
              value: "video-service:9094"
          ports:
            - containerPort: 8083
            - containerPort: 9092
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "12"
              memory: "32Gi"
              nvidia.com/gpu: 1
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: transcode-service
  namespace: go-video
spec:
  selector:
    app: transcode-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
    - name: grpc
      port: 9092
      targetPort: 9092
