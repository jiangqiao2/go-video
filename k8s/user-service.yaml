apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: go-video
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      imagePullSecrets:
        - name: acr-cred
      containers:
        - name: user-service
          image: <REPLACE_USER_IMAGE>
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_PATH
              value: "/app/configs/config_prod.yaml"
          ports:
            - containerPort: 8081
            - containerPort: 9091
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: go-video
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 9091
      targetPort: 9091

