## Redis 单实例部署与数据卷
# - PVC redis-data：持久化 Redis 数据
# - Deployment redis：无密码 Redis 7 实例
# - Service redis：在 go-video 命名空间内暴露 6379
apiVersion: v1 # API 版本
kind: PersistentVolumeClaim # Redis 数据卷
metadata:
  name: redis-data # PVC 名称
  namespace: go-video # 命名空间
spec:
  accessModes:
    - ReadWriteOnce # 单节点读写
  resources:
    requests:
      storage: 25Gi # 申请 25Gi 存储
  storageClassName: local-path # 存储类
---
apiVersion: apps/v1 # Deployment API 版本
kind: Deployment # 部署 Redis
metadata:
  name: redis # Deployment 名称
  namespace: go-video # 命名空间
spec:
  replicas: 1 # 副本数
  selector:
    matchLabels:
      app: redis # 匹配的标签
  template:
    metadata:
      labels:
        app: redis # Pod 标签
    spec:
      containers:
        - name: redis # 容器名称
          image: redis:7 # Redis 镜像
          imagePullPolicy: IfNotPresent # 镜像拉取策略
          args: ["--save", "", "--appendonly", "no", "--protected-mode", "no"] # 启动参数
          ports:
            - containerPort: 6379 # Redis 端口
          volumeMounts:
            - name: redis-data # 挂载卷
              mountPath: /data # 数据目录
          readinessProbe:
            tcpSocket:
              port: 6379 # 就绪探针端口
            initialDelaySeconds: 5 # 初始延迟
            periodSeconds: 10 # 探针周期
          livenessProbe:
            tcpSocket:
              port: 6379 # 存活探针端口
            initialDelaySeconds: 15 # 初始延迟
            periodSeconds: 20 # 探针周期
      volumes:
        - name: redis-data # 卷名称
          persistentVolumeClaim:
            claimName: redis-data # 绑定 PVC
---
apiVersion: v1 # Service API 版本
kind: Service # 暴露 Redis
metadata:
  name: redis # Service 名称
  namespace: go-video # 命名空间
spec:
  selector:
    app: redis # 选择标签
  ports:
    - name: redis # 端口名称
      port: 6379 # ClusterIP 端口
      targetPort: 6379 # 转发到容器端口
