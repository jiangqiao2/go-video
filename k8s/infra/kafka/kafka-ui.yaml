## Kafka UI (provectuslabs/kafka-ui)
# - Deployment: web UI for inspecting the Kafka cluster
# - Service: NodePort 30093 to access the UI from outside the cluster
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: go-video
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "go-video-kafka"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka.go-video.svc:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: go-video
  labels:
    app: kafka-ui
spec:
  type: NodePort
  selector:
    app: kafka-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30093

