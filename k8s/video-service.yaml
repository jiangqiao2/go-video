apiVersion: apps/v1 # Deployment API 版本
kind: Deployment # 部署视频服务
metadata:
  name: video-service # Deployment 名称
  namespace: go-video # 命名空间
spec:
  replicas: 2 # 副本数
  selector:
    matchLabels:
      app: video-service # 匹配标签
  template:
    metadata:
      labels:
        app: video-service # Pod 标签
    spec:
      imagePullSecrets:
        - name: acr-cred # 私有镜像凭证
      containers:
        - name: video-service # 容器名称
          image: <REPLACE_VIDEO_IMAGE> # 镜像（部署时替换）
          imagePullPolicy: IfNotPresent # 拉取策略
          env:
            - name: CONFIG_PATH # 配置文件路径
              value: "/app/configs/config_prod.yaml"
            - name: TZ
              value: "Asia/Shanghai"
          ports:
            - containerPort: 8085 # HTTP 端口
            - containerPort: 9094 # gRPC 端口
          resources:
            requests:
              cpu: "1" # 最低 CPU 申请
              memory: "2Gi" # 最低内存申请
            limits:
              cpu: "4" # CPU 上限
              memory: "8Gi" # 内存上限
          readinessProbe:
            tcpSocket:
              port: 8085 # 就绪探针端口
            initialDelaySeconds: 5 # 初始延迟
            periodSeconds: 10 # 周期
          livenessProbe:
            tcpSocket:
              port: 8085 # 存活探针端口
            initialDelaySeconds: 15 # 初始延迟
            periodSeconds: 20 # 周期
---
apiVersion: v1 # Service API 版本
kind: Service # 暴露视频服务
metadata:
  name: video-service # Service 名称
  namespace: go-video # 命名空间
spec:
  selector:
    app: video-service # 选择标签
  ports:
    - name: http # HTTP 端口
      port: 8085 # ClusterIP 端口
      targetPort: 8085 # 转发到容器
    - name: grpc # gRPC 端口
      port: 9094 # ClusterIP 端口
      targetPort: 9094 # 转发到容器
