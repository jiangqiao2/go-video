apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: go-video
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: acr-cred
      containers:
        - name: frontend
          image: <REPLACE_FRONTEND_IMAGE>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: frontend-nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: frontend-nginx-config
          configMap:
            name: frontend-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: go-video
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http-80
      port: 80
      targetPort: 80
      nodePort: 30000
