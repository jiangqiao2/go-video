apiVersion: apps/v1 # Deployment API 版本
kind: Deployment # 部署前端
metadata:
  name: frontend # Deployment 名称
  namespace: go-video # 命名空间
spec:
  replicas: 1 # 副本数
  selector:
    matchLabels:
      app: frontend # 匹配标签
  template:
    metadata:
      labels:
        app: frontend # Pod 标签
    spec:
      imagePullSecrets:
        - name: acr-cred # 私有镜像凭证
      containers:
        - name: frontend # 容器名称
          image: <REPLACE_FRONTEND_IMAGE> # 镜像（部署时替换）
          imagePullPolicy: IfNotPresent # 拉取策略
          ports:
            - containerPort: 80 # Web 端口
          volumeMounts:
            - name: frontend-nginx-config # Nginx 配置卷
              mountPath: /etc/nginx/conf.d/default.conf # 挂载路径
              subPath: default.conf # 使用 ConfigMap 中的文件
          readinessProbe:
            tcpSocket:
              port: 80 # 就绪探针端口
            initialDelaySeconds: 5 # 初始延迟
            periodSeconds: 10 # 周期
          livenessProbe:
            tcpSocket:
              port: 80 # 存活探针端口
            initialDelaySeconds: 15 # 初始延迟
            periodSeconds: 20 # 周期
      volumes:
        - name: frontend-nginx-config # Nginx 配置卷声明
          configMap:
            name: frontend-nginx-config # 提供配置的 ConfigMap
---
apiVersion: v1 # Service API 版本
kind: Service # 暴露前端
metadata:
  name: frontend # Service 名称
  namespace: go-video # 命名空间
spec:
  type: NodePort # 节点端口模式
  selector:
    app: frontend # 选择标签
  ports:
    - name: http-80 # HTTP 端口
      port: 80 # ClusterIP 端口
      targetPort: 80 # 转发到容器
      nodePort: 30000 # 节点端口
