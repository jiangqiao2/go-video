server:
  host: "0.0.0.0"
  port: 8085
  mode: release
  read_timeout: 60s
  write_timeout: 60s

log:
  level: info
  format: json
  output: stdout
  filename: ""
  max_size: 100
  max_backups: 7
  max_age: 30
  compress: true

database:
  host: "mysql.go-video.svc"
  port: 3306
  username: "root"
  password: "jiangqiao"
  database: "video_service"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600s

redis:
  host: "redis.go-video.svc"
  port: 6379
  password: ""
  db: 2
  pool_size: 10
  min_idle_conns: 5
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  enable_tls: false

jwt:
  secret: ""
  expire_time: 24h
  refresh_expire_time: 168h
  issuer: "go-video"
  rsa_private_key_path: "/app/certs/private.pem"
  rsa_public_key_path: "/app/certs/public.pem"
  rsa_private_key_password: "jiangqiao"

grpc_server:
  host: "0.0.0.0"
  port: 9094

grpc:
  timeout: 30s
  max_recv_msg_size: 4194304
  max_send_msg_size: 4194304
  retry_times: 3

service_registry:
  enabled: false
  service_name: "video-service"
  service_id: "video-service-1"
  register_host: ""
  ttl: 30s
  refresh_interval: 10s

grpc_service_registry:
  enabled: false
  service_name: "video-service-grpc"
  service_id: "video-service-grpc-1"
  register_host: ""
  ttl: 30s
  refresh_interval: 10s

dependencies:
  user_service:
    service_name: "user-service"
    address: ""
    host: "user-service.go-video.svc"
    port: 9091
    timeout: 30s
  transcode_service:
    service_name: "transcode-service"
    address: ""
    host: "transcode-service.go-video.svc"
    port: 9092
    timeout: 30s
  notification_service:
    service_name: "notification-service"
    address: ""
    host: "notification-service.go-video.svc"
    port: 9095
    timeout: 30s

public:
  storage_base: ""

minio:
  endpoint: ""
  access_key_id: ""
  secret_access_key: ""
  use_ssl: false
  bucket_name: ""

rustfs:
  endpoint: "rustfs.go-video.svc:9000"
  access_key: "jiangqiao"
  secret_key: "jiangqiao"
  use_ssl: false

etcd:
  endpoints: []
  dial_timeout: 5s
  request_timeout: 3s
  username: ""
  password: ""
