version: '3.8'

services:
  # API网关
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - USER_SERVICE_URL=http://user-service:8081
      - UPLOAD_SERVICE_URL=http://upload-service:8082
      - VIDEO_SERVICE_URL=http://video-service:8083
    depends_on:
      - user-service
      - upload-service
      - video-service
    networks:
      - microservices

  # 用户服务
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_DSN=root:123456@tcp(user-db:3306)/user_service?charset=utf8mb4&parseTime=True&loc=Local
    depends_on:
      - user-db
    networks:
      - microservices

  # 上传服务
  upload-service:
    build:
      context: ./upload-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - DB_DSN=root:123456@tcp(upload-db:3306)/upload_service?charset=utf8mb4&parseTime=True&loc=Local
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      - upload-db
      - minio
    networks:
      - microservices

  # 视频服务
  video-service:
    build:
      context: ./video-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - DB_DSN=root:123456@tcp(video-db:3306)/video_service?charset=utf8mb4&parseTime=True&loc=Local
    depends_on:
      - video-db
    networks:
      - microservices

  # 用户服务数据库
  user-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: user_service
    volumes:
      - user_db_data:/var/lib/mysql
      - ./scripts/mysql/user_service.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    networks:
      - microservices

  # 上传服务数据库
  upload-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: upload_service
    volumes:
      - upload_db_data:/var/lib/mysql
      - ./scripts/mysql/upload_service.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3308:3306"
    networks:
      - microservices

  # 视频服务数据库
  video-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: video_service
    volumes:
      - video_db_data:/var/lib/mysql
      - ./scripts/mysql/video_service.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3309:3306"
    networks:
      - microservices

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - microservices

  # Redis缓存
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - microservices

volumes:
  user_db_data:
  upload_db_data:
  video_db_data:
  minio_data:
  redis_data:

networks:
  microservices:
    driver: bridge