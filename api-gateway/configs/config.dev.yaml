server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug"
  read_timeout: 60s
  write_timeout: 60s

database:
  host: "localhost"
  port: 3306
  username: "root"
  password: "123456"
  database: "go_video"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600s

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

jwt:
  secret: "user-service-secret-key-for-development"
  expire_time: 168h  # 7天
  refresh_expire_time: 720h  # 30天

log:
  level: "debug"
  format: "json"
  output: "stdout"
  filename: "logs/app.log"
  max_size: 100
  max_age: 30
  max_backups: 10
  compress: true

minio:
  endpoint: "localhost:9000"
  access_key_id: "minioadmin"
  secret_access_key: "minioadmin"
  use_ssl: false
  bucket_name: "video-storage"