# 上传服务开发环境配置
server:
  host: "0.0.0.0"
  port: 8082
  mode: "debug"  # debug, release, test
  read_timeout: 60s
  write_timeout: 60s

database:
  host: "118.196.42.111"
  port: 3306  # 使用实际的MySQL容器端口
  username: "root"
  password: "root123"
  database: "upload_service"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600s

redis:
  # 容器内访问宿主机 Redis，使用 host.docker.internal；如在同一 Docker 网络内则改成对应容器名
  host: "host.docker.internal"
  port: 6379
  password: ""
  db: 1  # 使用不同的db避免冲突
  pool_size: 10
  min_idle_conns: 5
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  enable_tls: false

jwt:
  secret: "upload-service-jwt-secret-key-2024"
  expire_time: 24h
  refresh_expire_time: 168h  # 7 days

log:
  level: "debug"  # debug, info, warn, error
  format: "json"  # json, text
  output: "stdout"  # stdout, file
  filename: "logs/upload-service.log"
  max_size: 100  # MB
  max_backups: 7
  max_age: 30  # days
  compress: true

storage:
  provider: "minio"

minio:
  endpoint: "124.221.86.127:9000"
  access_key_id: "minioadmin"
  secret_access_key: "minioadmin123"
  use_ssl: false
  bucket_name: "uploads"

# RustFS配置
rustfs:
  endpoint: "124.221.86.127:9000"
  access_key: "rustfsadmin"
  secret_key: "rustfsadmin"
  use_ssl: false

# etcd配置
etcd:
  endpoints:
    - "113.44.37.116:2379"
  dial_timeout: 5s
  request_timeout: 3s
  username: ""
  password: ""

# gRPC客户端配置
grpc:
  timeout: 30s
  max_recv_msg_size: 4194304  # 4MB
  max_send_msg_size: 4194304  # 4MB
  retry_times: 3

grpc_server:
  host: "0.0.0.0"
  port: 9093

grpc_service_registry:
  service_name: "upload-service-grpc"
  service_id: "upload-service-grpc-1"
  register_host: "192.168.35.234"
  ttl: 30s
  refresh_interval: 10s
  enabled: false

# 本地服务注册配置
service_registry:
  service_name: "upload-service"
  service_id: "upload-service-1"
  register_host: "127.0.0.1"  # 容器注册到 etcd 使用的可达地址，内网/同网络容器可改为容器名
  ttl: 30s
  refresh_interval: 10s
  enabled: false

# 依赖服务配置
dependencies:
  user_service:
    service_name: "user-service"
    address: ""
    host: "host.docker.internal"
    port: 9091
    timeout: 30s
  transcode_service:
    service_name: "transcode-service"
    address: ""
    host: "localhost"
    port: 9092
    timeout: 30s

# 上传服务特定配置
upload:
  max_file_size: 100MB  # 最大文件大小
  allowed_types:
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "video/mp4"
    - "video/avi"
    - "video/mov"
    - "application/pdf"
    - "text/plain"
  upload_path: "./uploads"  # 本地临时存储路径
  chunk_size: 1MB  # 分片上传大小

# 服务发现配置
service_discovery:
  enabled: false
  consul:
    address: "localhost:8500"
    service_name: "upload-service"
    health_check_interval: "10s"

# 监控配置
monitoring:
  metrics:
    enabled: true
    path: "/metrics"
  tracing:
    enabled: false
    jaeger_endpoint: "http://localhost:14268/api/traces"

# 对外访问配置
public:
  storage_base: "http://localhost:8000"
